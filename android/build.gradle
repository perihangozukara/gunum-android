// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Bu bilgisayarda yalnızca Android Studio'nun Java 25'i (JBR) var; bildirim eklentisi Java 21 araç zinciri istiyor.
// İndirme yapmamak için araç zincirini kurulu Java'ya çeviriyoruz (derleme hedefi yine Java 21 kalır).
subprojects {
    afterEvaluate { p ->
        def j = p.extensions.findByName('java')
        if (j != null) j.toolchain.languageVersion = JavaLanguageVersion.of(JavaVersion.current().majorVersion)
        p.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach { t ->
            def hedef = t.compilerOptions.jvmTarget
            hedef.set(Enum.valueOf(hedef.get().getClass(), 'JVM_21'))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
